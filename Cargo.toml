[workspace]
resolver = "2"
members = [
    "crates/cybercipher-core",
    "crates/cybercipher-codec",
    "crates/cybercipher-engine",
    "crates/cybercipher-crypto",
    "crates/cybercipher-attack",
    "crates/cybercipher-pki",
    "crates/cybercipher-media",
    "crates/cybercipher-steg",
    "crates/cybercipher-sstv",
    "apps/cybercipher-gui",
    "apps/cybercipher-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jacek4yang-labs/CyberCipher"
description = "High-performance local-first cryptography and CTF workbench"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
base64 = "0.22"
percent-encoding = "2"
flate2 = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
dirs = "6"
parking_lot = "0.12"
criterion = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
# Direct dependency of cybercipher-media's indexed-PNG path: the `image`
# crate does not expose palette/indices, and `png` is already in the tree via
# image's `png` feature (no new transitive dependencies).
png = "0.18"
rustfft = "6.2"
# Pinned exact per docs/design-steg-sstv.md (hard invariant 2): slowrx stays a
# pinned crates.io dependency, re-evaluated for vendoring at 1.0.
slowrx = "=0.5.3"
symphonia = { version = "0.5.4", features = ["aac", "adpcm", "alac", "flac", "isomp4", "mkv", "mp1", "mp2", "mp3", "ogg", "pcm", "vorbis", "wav", "aiff", "caf"] }
# Dev-dependency of cybercipher-sstv: synthetic WAV fixtures in tests only.
hound = "3.5"

cybercipher-core = { path = "crates/cybercipher-core" }
cybercipher-codec = { path = "crates/cybercipher-codec" }
cybercipher-engine = { path = "crates/cybercipher-engine" }
cybercipher-crypto = { path = "crates/cybercipher-crypto" }
cybercipher-attack = { path = "crates/cybercipher-attack" }
cybercipher-pki = { path = "crates/cybercipher-pki" }
cybercipher-media = { path = "crates/cybercipher-media" }
cybercipher-steg = { path = "crates/cybercipher-steg" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
