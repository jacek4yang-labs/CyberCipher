[package]
name = "cybercipher-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CyberCipher command line interface (shares the engine with the GUI)"

[[bin]]
name = "cybercipher"
path = "src/main.rs"

[dependencies]
cybercipher-core.workspace = true
cybercipher-engine.workspace = true
cybercipher-codec.workspace = true
cybercipher-crypto.workspace = true
cybercipher-attack.workspace = true
cybercipher-pki.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
num-bigint.workspace = true
