# ------------------------------------------------------------- superset ----

[entries.typed_errors_provenance]
ours = "OperationError kinds, provenance, ExecutionContext deadlines"
status = "superset"
notes = "Upstream throws IllegalArgumentException/NullPointerException-style errors and uses thread interrupts; CyberCipher wraps everything in typed operation errors with parameter context, cost classes (Instant transforms / Solver scans / Heavy SSTV), cancellation + deadline."

[entries.registry_recipe_integration]
ours = "OperationRegistry + recipe engine + incremental cache"
status = "superset"
notes = "Steg/SSTV operations register like every other CyberCipher op: compose in recipes, auto-bake for Instant cost classes, audit trails. Upstream has no equivalent."

[entries.cross_tool_composition]
ours = "planned end-to-end chains"
status = "missing"
notes = "Image -> transform/LSB -> bytes -> Auto Decode -> flag; QR bytes -> Auto Decode; SSTV -> PNG -> Stego -> Auto LSB -> Auto Decode. This composition is the core product goal; regression fixtures per docs/design-steg-sstv.md acceptance flows A..J."
