# StegSolver compatibility matrix — steganography engine baseline.
# Statuses: covered | superset | partial | missing | intentional-out-of-scope | same-capability
#
# StegSolver (https://github.com/jacek4yang/stegsolver, MIT) is a Java 21 /
# JavaFX rebuild of the original StegSolve by Caesum. CyberCipher targets the
# ENGINE semantics, not the Java UI: bit-exact transform/extract behavior,
# structural analysis, and payload recovery, ported to safe Rust with no Java
# runtime in the product or (after fixtures are pinned) in CI.
#
# Reference commit: c14bfa9 (main, 2026-09). Engine packages inspected:
# core/ (ImageData, ImageOps, Channel, Roi, FrameSource, CoalescingJobRunner),
# transform/ (TransformCatalog 42 defs, ImageTransforms, CombineMode,
# StereoTransform), extract/ (DataExtractor, ExtractionOptions, RgbOrder,
# AutoLsbScanner, LsbCandidate), parser/ (Png/Jpeg/Gif/Bmp + FileReport),
# barcode/ (BarcodeScanner, PayloadDetector, StructuredAppend).
#
# Parity oracle: src/test/java/.../transform/LegacyReference.java (literal
# transcription of legacy StegSolve algorithms, tests-only). CyberCipher pins
# deterministic fixtures + expected outputs generated against these semantics;
# Java is NOT required at CyberCipher runtime and not in normal CI.

[meta]
upstream = "https://github.com/jacek4yang/stegsolver"
baseline_date = 2026-09-30
source_commit = "c14bfa98b6f0af1a142773329b2a188455972d8f"
license = "MIT"
notes = "Behavioral/source reference only. Java UI is out of scope by hard acceptance test (final tar.gz contains/requires no JVM/JavaFX/Maven). Lane A/B/C/D/F = planned CyberCipher PR sequence, see docs/design-steg-sstv.md."

# ------------------------------------------------------- image core ----

[entries.image_data_model]
ours = "cybercipher-media::RgbaImage (flat 0xAARRGGBB Vec<u32>)"
status = "covered"
notes = "Non-premultiplied 0xAARRGGBB u32/pixel in a flat row-major Vec, has_alpha, IndexedData{palette,indices}, crop, pixel. Layout identical to the reference so golden tests transfer (PR #48)."

[entries.image_decode_bounded]
ours = "cybercipher-media::decode (bounded)"
status = "covered"
notes = "image crate + indexed-PNG palette path: 256 MiB file cap and 64 MiPx pixel cap enforced BEFORE allocation, untrusted header dims overflow-checked, typed MediaError, magic sniffing (PR #48)."

[entries.image_encode]
ours = "cybercipher-media::encode_png"
status = "covered"
notes = "RGB or RGBA 8-bit PNG; roundtrip-tested (PR #48)."

[entries.roi]
ours = "cybercipher-media::Roi"
status = "covered"
notes = "Reference-exact clamp semantics (disjoint regions keep the clamped origin, verified against Roi.clamp) (PR #48)."

[entries.channel_model]
ours = "steg::transforms::Channel"
status = "covered"
notes = "Shifts 24/16/8/0 and plane-space ordinals 0..3 exactly matching ExtractionOptions.bitFor (PR #48)."

[entries.transform_catalog_42]
ours = "steg::transforms::catalog (42 entries)"
status = "covered"
notes = "StegSolve order preserved: 0 original, 1 invert, 2..9 alpha planes 7..0, 10..17 red, 18..25 green, 26..33 blue, 34..37 full channels, 38..40 random colour maps 1..3, 41 gray pixels; forced-opaque outputs. Golden parity vs a tests-only LegacyReference oracle on synthetic images (PR #48)."

[entries.transform_bit_planes]
ours = "transforms::bit_plane"
status = "covered"
notes = "Bit-exact; oracle-verified across all 32 channel/plane combinations (PR #48)."

[entries.transform_invert]
ours = "transforms::invert"
status = "covered"
notes = "Bit-exact; oracle-verified (PR #48)."

[entries.transform_full_channel_mask]
ours = "transforms::mask"
status = "covered"
notes = "Legacy quirk reproduced exactly as Java int arithmetic: result >>>= 8 when the mask reaches the alpha byte (full alpha renders as red); oracle-verified with an explicit sanity assertion (PR #48)."

[entries.transform_random_colour_maps]
ours = "transforms::random_map + java_random::JavaRandom"
status = "covered"
notes = "Faithful java.util.Random port (48-bit LCG, power-of-two nextInt path) as documented engine code; component-map draw order bm..rx and palette map for indexed sources reproduced; oracle-verified and deterministic (PR #48)."

[entries.transform_gray_pixels]
ours = "transforms::gray_pixels"
status = "covered"
notes = "Bit-exact; oracle-verified (PR #48)."

[entries.transform_engine_cancellation]
ours = "ExecutionContext cancellation in transforms/extraction; CostClass registered"
status = "partial"
notes = "Cancellation checked per row/col; transforms are CostClass::Instant. Remaining for full parity: bounded transform/render caches + coalescing of superseded jobs in the Tauri command layer (Stego Lab GUI lane). Missing semantics: generation-ID discard of stale render jobs."

[entries.manual_bit_extraction]
ours = "steg::extract::extract_bounded"
status = "covered"
notes = "Full contract: plane mask in plane space, alpha-first visit order, 6 RGB permutations (legacy codes 1..6), planes 7..0/0..7, row/column traversal, invert_bits, MSB-first packing, zero-padded trailing byte, bounded max_bytes with total_bytes+truncated, ROI clamp, per-row cancellation. Hand-computed vectors cover every dimension (PR #48)."

[entries.extraction_preview_bound]
ours = "image_extract_bits op default 64 KiB, cap 16 MiB"
status = "covered"
notes = "Registry op default max_bytes 65536; full extraction via explicit max_bytes in the engine API (PR #48). GUI preview wiring lands with Stego Lab."

[entries.auto_lsb_fast_scan]
ours = "steg::auto_lsb::fast_scan_options(has_alpha) — 118 options without alpha, 130 with (pinned in tests)"
status = "covered"
notes = "Exact Fast enumeration: RGB bit0 x6 orders x row/col x invert (24); RGB bits1,2 x {RGB,BGR} x row/col (8); RGB bits0+1 x6 x row/col x msb/lsb x invert (48); bits0+1+2 x {RGB,BGR} x row/col x msb/lsb (8); single-channel R/G/B bit0 row/col x invert (12), bit1 row/col (6), bits0+1 row/col x msb/lsb (12); alpha variants when has_alpha (alpha bit0 row/col x invert 4; RGBA bit0 x {RGB,BGR} x row/col x invert 8). Group order and per-group ordering match AutoLsbScanner.java c14bfa9 item for item. Lane A PR-2."

[entries.auto_lsb_deep_scan]
ours = "steg::auto_lsb::deep_scan_options(has_alpha) — 158 / 170 options"
status = "covered"
notes = "Fast superset: 3-bit LSB across remaining 4 permutations (16), 4-bit LSB {RGB,BGR} x row/col x msb/lsb (8), MSB bit7 {RGB,BGR} x row/col (4), single-channel bit2/bit7 x R/G/B x row/col (12). Lane A PR-2."

[entries.auto_lsb_scoring]
ours = "steg::auto_lsb::score_payload over steg::payload::detect — the deterministic table, entropy via cybercipher_core::util::shannon_entropy"
status = "covered"
notes = "Ported verbatim: 98 CTF flag (regex (?i)(flag|ctf|steg|key|secret|pico|htb|thm)\\{[\\x20-\\x7e]{1,128}\\}, first 16 KiB, scanned before the type switch); 100 strong magic (zip/7z/rar/gzip/bzip2/xz/tar/png/jpeg/gif/webp/pdf/elf/PE-with-verified-header/CAFEBABE); 95 BMP>=14B; 94 #! script; 92 JSON/XML (binary-classified only, as upstream); 90/86/80 text tiers (upstream printable = 0x20..0x7E, whitespace excluded — this is what keeps tier 80 reachable); 72/45 base64; 65 partial-printable + unverified MZ; 30 structured binary; 20 binary; 15 high-entropy noise; 10 unclassified; 5 low variation; 1 uniform byte; 0 empty. Payload types mirror upstream PayloadDetector (steg/payload.rs); the codec's fileinfo magic table is not yet publicly reusable — switch the magic half of payload.rs to it once codec exposes a sniff API."

[entries.auto_lsb_dedup_rank]
ours = "steg::auto_lsb::DedupRanker + scan_with_limits — XXH3 fingerprint over the bounded preview"
status = "covered"
notes = "Dedup by fingerprint+total_bytes (+options when truncated — a matching prefix does not prove identical full payloads), higher-score duplicate replaces in place, rank by score desc (stable, ties keep insertion order), progress callbacks every 8 candidates + final. Upstream's 10-candidate batch flushes are a UI concern; the headless scan returns one ranked Vec. Lane A PR-2."

[entries.auto_lsb_phase2_apply]
ours = "Phase 2 = extract_bounded with the candidate's options at any max_bytes (engine-side); registry op auto_lsb_scan (CostClass::Solver) returns settings JSON that feeds image_extract_bits directly. GUI Apply Settings / Send to Workbench / Save Payload land with the Stego Lab lane"
status = "partial"
notes = "Engine + registry surface complete and tested end-to-end (scan ranks a hidden payload top; apply recovers it). The cross-tool handoff (Workbench/Auto-Decode composition) and GUI actions are the later GUI lane. Lane A PR-2 + GUI."

# ------------------------------------------------ structure/carving ----

[entries.png_structure]
ours = "steg::structure::analyze_png + png_structure op"
status = "covered"
notes = "Chunk walk over raw file bytes: per-chunk offset/declared-length/data-offset/CRC-validity, chunk-type flags (critical/public/reserved/safe-to-copy) + description table, IHDR geometry with validity warnings, palette entry count + capped sample, bounded tEXt/zTXt/iTXt comment extraction (zTXt/iTXt zlib-inflated with a 1 KiB cap), tIME/pHYs decode, logical EOF at IEND with appended-data detection. 512-chunk cap, 64-warning cap, checked reads throughout. Lane C PR-1."

[entries.jpeg_structure]
ours = "steg::structure::analyze_jpeg + jpeg_structure op"
status = "covered"
notes = "Marker walk with 0xFF fill handling: segment offsets/lengths (offsets reported at the marker code byte), APPn identifier sniffing (JFIF/JFXX/Exif/ICC/Photoshop/XMP/Adobe), SOFn geometry + component list, DRI/DNL fields, COM comments (bounded), entropy-coded scan walked with FF00/RST semantics plus a step cap, logical EOF at EOI with appended-data detection. Lane C PR-1."

[entries.gif_structure]
ours = "steg::structure::analyze_gif + gif_structure op"
status = "covered"
notes = "Logical screen descriptor, global/local colour tables (capped sample + adjacent-duplicate note), image descriptors with LZW minimum-code-size offsets and sub-block byte counts, graphic control/comment/plain-text/application extensions, bounded comment extraction, frame count, trailer offset as logical EOF with appended-data detection. One deliberate upstream deviation: the graphic-control sub-block skip starts after the block proper (the reference could mis-skip when the transparent index was non-zero). Lane C PR-1."

[entries.bmp_structure]
ours = "steg::structure::analyze_bmp + bmp_structure op"
status = "covered"
notes = "BITMAPFILEHEADER + DIB header variants (OS/2 BITMAPCOREHEADER 12 .. BITMAPV5HEADER 124): dims/top-down/planes/bpp, compression names, colour-table size/offset/entry-size with capped sample, header-to-pixels gap dump, row-stride and pixel-array math in checked u64 (impossible geometry is a warning, never an overflow), validated against the real file size; logical EOF at the pixel-array end (carving disabled for compressed layouts). Lane C PR-1."

[entries.appended_data_carving]
ours = "steg::carving + image_extract_appended op (superset: detected magic via the codec's file-magic table)"
status = "covered"
notes = "Per-format expected_end (IEND/EOI/trailer/pixel-array end); appended section reports offset/size, detected magic via the shared cybercipher-codec::sniff_magic detector (same table the file-magic op uses), 256-byte hex preview and a bounded printable-string snippet. image_extract_appended (CostClass::Interactive) emits the JSON header line plus the raw appended bytes (bounded, default 64 KiB, cap 16 MiB) for chaining into Auto Decode. Carving only inspects — never unpacks or executes. Lane C PR-1."

[entries.frame_animation_support]
ours = "—"
status = "missing"
notes = "Lazy frame access, bounded cache, frame metadata, export selected frame (GIF first; APNG/WebP if library support is clean). Lane C PR-2."

