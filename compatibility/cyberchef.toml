# CyberChef compatibility matrix.
# Statuses: covered | superset | partial | missing | intentional-out-of-scope | same-capability
#
# Entries reflect implemented reality only — every entry below was checked
# against the operation implementations and tests on `main` (commit 5d5ab8e,
# 2026-09-28), not against names or plans. Capabilities that live on a feature
# branch awaiting merge are marked "PR in flight".
#
# Registry snapshot used for this matrix:
#   - 59 recipe-registry operations on main
#   - +14 on branch agent/crypto/m5-aead (10 AEAD + 4 KDF ops), PR in flight
#   - attack engine (RSA / PRNG) is exposed via CLI + GUI, not the recipe
#     registry, and therefore has no upstream CyberChef op counterpart
#     (see [superset]).

[meta]
upstream = "https://github.com/gchq/CyberChef"
baseline_date = 2026-09-28
upstream_op_count = "≈500 (src/core/operations, master)"
notes = "CyberChef is an interoperability/UX reference, not an authority. Entries reflect implemented reality only."

