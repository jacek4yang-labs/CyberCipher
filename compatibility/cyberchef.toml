# -------------------------------------------------------------- crypto ----
# All cipher ops: explicit key-length + IV validation, key/key_encoding params.

[entries.AES_Encrypt]
ours = "aes-encrypt"
status = "partial"
notes = """Modes ECB/CBC/CTR/CFB/OFB; padding PKCS7/Zero/ISO7816/None; keys 16/24/32 bytes.
No GCM inside the op — upstream folds GCM into AES; ours ships AEAD as separate
aead-aes-gcm-encrypt/decrypt ops (PR in flight). No CTS/XTS in either."""

[entries.AES_Decrypt]
ours = "aes-decrypt"
status = "partial"
notes = "Same mode/padding surface as aes-encrypt; decrypt validates the selected padding scheme."

[entries.Triple_DES_Encrypt]
ours = "des-encrypt (16/24-byte key)"
status = "partial"
notes = "ECB/CBC only; upstream DES/3DES ops add CFB/OFB/CTR. NoPadding equivalence via padding=none."

[entries.Triple_DES_Decrypt]
ours = "des-decrypt (16/24-byte key)"
status = "partial"
notes = "Same gap as Triple_DES_Encrypt."

[entries.DESEncrypt]
ours = "des-encrypt (8-byte key)"
status = "partial"
notes = "ECB/CBC only; legacy, labeled Broken in the registry."

[entries.DESDecrypt]
ours = "des-decrypt (8-byte key)"
status = "partial"

[entries.RC4]
