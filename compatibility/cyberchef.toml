# CyberChef compatibility matrix — Milestone 1 scope.
# Statuses: covered | superset | partial | missing | intentional-out-of-scope | same-capability

[meta]
upstream = "https://github.com/gchq/CyberChef"
baseline_date = 2026-09-28
notes = "CyberChef is an interoperability/UX reference, not an authority. Entries reflect implemented reality only."

[entries.From_Hex]
ours = "from-hex"
status = "covered"
notes = "Strict + relaxed modes with offset diagnostics."

[entries.To_Hex]
ours = "to-hex"
status = "covered"
notes = "No per-group word separator yet; single separator parameter."

[entries.From_Base64]
ours = "from-base64"
status = "covered"
notes = "Standard + URL-safe alphabets, strict + relaxed with padding repair."

[entries.To_Base64]
ours = "to-base64"
status = "covered"

[entries.From_Base32]
ours = "from-base32"
status = "covered"
notes = "RFC 4648 standard + extended-hex alphabets."

[entries.To_Base32]
ours = "to-base32"
status = "covered"

[entries.URL_Decode]
