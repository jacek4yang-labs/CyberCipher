# -------------------------------------------------------------- superset ----
# Capabilities we have that CyberChef does not. Upstream ships PRNG
# generators (PseudoRandomIntegerGenerator / PseudoRandomNumberGenerator)
# but no recovery/attack tooling.

[superset.rsa_attack_engine]
ours = "cybercipher-attack::rsa (CLI `rsa`, GUI RSA Attack Lab)"
notes = "Analyzer + 12 attacks: known-pq, known-d, known-phi, dp-leak, common-modulus, hastad, shared-prime, low-e, wiener, fermat, pollard-rho, pollard-pm1. Each attack declares preconditions, runs under explicit resource bounds, and returns typed outcomes with diagnostics (40 integration tests)."

[superset.lcg_recovery]
ours = "cybercipher-attack::prng::lcg (CLI `prng`)"
notes = "Parameter recovery with known modulus (≥3 outputs), blind a/b/m recovery (≥6 outputs), seed walk-back, forward/backward prediction; graceful failure on degenerate/non-invertible inputs."

[superset.mt19937_recovery]
ours = "cybercipher-attack::prng::mt19937 (CLI `prng`)"
notes = "State cloning via untempering, init_genrand/init_by_array seeding, CPython random.seed/getrandbits-compatible reconstruction; reference vectors tested."

[superset.runtime_prng_recovery]
ours = "cybercipher-attack::prng (Java Random / glibc rand / MSVC rand)"
notes = "Partial (PR in flight): Java 48-bit truncated-LCG state recovery from two outputs, glibc TYPE_3 additive-feedback rand, MSVC rand inversion — branch feat/runtime-prngs."

[superset.evp_bytestokey]
ours = "evp-bytestokey"
notes = "Partial (PR in flight) on the AEAD/KDF branch; upstream has no standalone EVP_BytesToKey op."
