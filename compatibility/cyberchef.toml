# CyberChef compatibility matrix.
# Statuses: covered | superset | partial | missing | intentional-out-of-scope | same-capability
#
# Entries reflect implemented reality only — every entry was checked
# against the operation implementations and tests on the current branch,
# not against names or plans. Capabilities that live on a feature branch
# awaiting merge are marked "PR in flight".
#
# Registry snapshot used for this matrix:
#   - recipe-registry operations on main (59 at commit 5d5ab8e) plus the
#     AEAD/KDF ops merged since, plus the parity-mop-up block
#     (checksums/non-crypto hashes/MD4/RIPEMD-160/BLAKE2/Whirlpool/hexdump/
#     C escapes/JSON escape/BCD/ModHex/COBS/NetBIOS/Base100) from
#     agent/crypto/parity-mopup
#   - attack engine (RSA / PRNG) is exposed via CLI + GUI, not the recipe
#     registry, and therefore has no upstream CyberChef op counterpart
#     (see [superset]).

[meta]
upstream = "https://github.com/gchq/CyberChef"
baseline_date = 2026-09-28
upstream_op_count = "≈500 (src/core/operations, master)"
notes = "CyberChef is an interoperability/UX reference, not an authority. Entries reflect implemented reality only."

