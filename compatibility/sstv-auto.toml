# ------------------------------------------------------------- tests ----

[entries.test_migration]
ours = "135 inline + 15 end-to-end tests"
status = "covered"
notes = "All upstream tests migrated and green (150 vs upstream 142; error-module tests added). Large fixture excluded per upstream skip design (PR #47)."

[entries.typed_errors_bounds]
ours = "typed OperationError + ExecutionContext deadlines/cancellation"
status = "superset"
notes = "Upstream uses anyhow + strict clippy (no unwrap/panic outside tests). We keep those lints in the migrated crate and add typed operation errors, cost classes, and resource bounds at the registry boundary."

[entries.registry_recipe_integration]
ours = "OperationRegistry + recipes + provenance"
status = "superset"
notes = "sstv_decode registers as CostClass::Heavy op; results become blobs consumable by every other CyberCipher tool. Upstream is a standalone CLI."

