# sstv-auto compatibility matrix — SSTV decode/synthesis baseline.
# Statuses: covered | superset | partial | missing | intentional-out-of-scope | same-capability
#
# sstv-auto (https://github.com/jacek4yang/sstv-auto, MIT, Rust, rust-version
# 1.85) is already a library crate with the exact layering CyberCipher wants.
# Integration strategy (docs/design-steg-sstv.md): migrate its modules into a
# workspace crate `cybercipher-sstv` (option 1 — in-tree refactor), NOT a
# subprocess and NOT a long-term git dependency. Its decode backend is the
# pure-Rust `slowrx` crate (published library, no runtime executable), pinned
# as a normal dependency; symphonia provides pure-Rust audio ingestion (no
# ffmpeg at runtime).
#
# Reference commit: f626d50 (main, 2026-09). 13 modules, 142 tests.

[meta]
upstream = "https://github.com/jacek4yang/sstv-auto"
baseline_date = 2026-09-30
source_commit = "f626d505e2928efaa7c217e21fb61fcf43686768"
license = "MIT"
notes = "Lane B PR sequence: PR-1 core crate migration (library, tests preserved), PR-2 blob/file bridge + Tauri commands, PR-3 SSTV Lab UI + Stego handoff. Attribution: MIT license notices preserved, provenance entry in PROVENANCE.md."

