[package]
name = "cybercipher-steg"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Image steganography engine: StegSolve-compatible transforms, bit extraction, Auto LSB, structural container analysis and appended-data carving (CyberCipher)"

[dependencies]
cybercipher-core.workspace = true
cybercipher-codec.workspace = true
cybercipher-media.workspace = true
flate2.workspace = true
rxing.workspace = true
serde_json.workspace = true
xxhash-rust.workspace = true

[dev-dependencies]
# The library never encodes barcodes; the synthetic QR fixtures in tests are
# produced with rxing's encoder, enabled only for test builds (features are
# unified across the dependency graph for the same target).
rxing = { workspace = true, features = ["encoders"] }
