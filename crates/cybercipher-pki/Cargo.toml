[package]
name = "cybercipher-pki"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Public-key infrastructure operations (RSA key formats, inspection, JWK) for CyberCipher"

[dependencies]
cybercipher-core.workspace = true
serde.workspace = true
serde_json.workspace = true

# RSA key generation and raw crypto (OAEP sanity checks). The `pem` feature
# enables the pkcs1/pkcs8 encode/decode trait impls on the rsa key types.
rsa = { version = "0.9", features = ["sha2", "pem"] }

# ASN.1 layer. Kept version-aligned with rsa 0.9 (pkcs1 0.7 / pkcs8 0.10 /
# spki 0.7 on der 0.7) so the parsed structures interoperate directly.
pkcs1 = { version = "0.7", features = ["alloc", "pem"] }
pkcs8 = { version = "0.10", features = ["alloc", "pem"] }
spki = { version = "0.7", features = ["alloc", "pem"] }
der = { version = "0.7", features = ["alloc"] }

# rsa 0.9 is built on num-bigint-dig 0.8 (NOT the workspace `num-bigint`
# 0.4 — different crate). Declared explicitly so we can name `BigUint` for
# component extraction and CRT-parameter arithmetic.
num-bigint-dig = "0.8"

# Hashes for the digest-parameterized operations. `oid` enables
# `AssociatedOid`, which `rsa::Pkcs1v15Sign::new::<D>()` requires to build the
# RFC 8017 DigestInfo prefixes. sha2 is version-aligned with the copy rsa
# re-exports (both resolve to digest 0.10, so hasher types are interchangeable).
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
rand = "0.8"
base64ct = "1"

# --- ECC foundation (NIST curves + Ed25519 + X25519) ---
# Mature RustCrypto crates; no hand-implemented curve arithmetic anywhere in
# the `ecc` module. elliptic-curve 0.13 is version-aligned with the ASN.1
# stack above (pkcs8 0.10 / spki 0.7 / der 0.7), so SPKI/PKCS#8 structures are
# interoperable with the RSA side of the crate.
elliptic-curve = { version = "0.13", features = ["alloc", "pem", "pkcs8", "sec1"] }
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "pem", "pkcs8", "std"] }
p384 = { version = "0.13", features = ["ecdsa", "ecdh", "pem", "pkcs8", "std"] }
# The shared ECDSA layer p256/p384 build on (0.16 in both). Added explicitly so
# the generic P-256/P-384 helpers can name `ecdsa::Signature<C>`/`SigningKey`.
ecdsa = { version = "0.16", features = ["alloc", "der", "digest", "signing", "verifying"] }
ed25519-dalek = { version = "2", default-features = false, features = ["fast", "rand_core", "zeroize", "alloc", "pkcs8", "pem"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
signature = "2"

# --- SM2 (GB/T 32918) + SM3 (GB/T 32905), Chinese national-standard crypto ---
# RustCrypto's sm2 crate provides the SM2 curve (sm2p256v1), the SM2 digital
# signature algorithm (`dsa` module) and SM2 public-key encryption (`pke`
# module). sm3 is the companion 256-bit hash (also used for the ZA digest and
# the C3 integrity hash inside SM2 ciphertexts). Both are version-aligned with
# the elliptic-curve 0.13 / pkcs8 0.10 stack above.
sm2 = { version = "0.13", features = ["alloc", "pem", "pkcs8", "std"] }
sm3 = "0.4"

# --- JWT / JWS (RFC 7519 + RFC 7515) ---
# HMAC for the HS* family (version-aligned with the sha2 0.10 copy above,
# both on digest 0.10). subtle (already resolved transitively via the
# elliptic-curve stack) provides the constant-time MAC comparison.
hmac = "0.12"
subtle = "2"

# --- X.509 certificate / CSR / CRL structures ---
# x509-cert 0.2 is version-aligned with the ASN.1 stack above (der 0.7 /
# spki 0.7), so parsed structures interoperate directly with the key-format
# code. x509-parser (asn1-rs/der-parser based, independent of that stack)
# supplements it with the richer extension parsers (SAN, key usage, EKU, ...)
# that x509-cert 0.2 does not decode for us.
x509-cert = "0.2"
x509-parser = "0.16"
