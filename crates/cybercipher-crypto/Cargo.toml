[package]
name = "cybercipher-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Symmetric cryptography, hash, and MAC operations for CyberCipher"

[dependencies]
cybercipher-core.workspace = true
cybercipher-codec.workspace = true
serde.workspace = true
serde_json.workspace = true

# RustCrypto block ciphers and modes
cipher = { version = "0.4", features = ["alloc"] }
aes = "0.8"
des = "0.8"
sm4 = "0.5"
ecb = { version = "0.1", features = ["alloc"] }
cbc = { version = "0.1", features = ["alloc"] }
ctr = "0.9"
cfb-mode = "0.8"
ofb = "0.6"
block-padding = "0.3"

# Digests and MAC
digest = "0.10"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
sm3 = "0.4"
hmac = "0.12"

[dev-dependencies]
cybercipher-engine.workspace = true
