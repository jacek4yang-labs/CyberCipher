[package]
name = "cybercipher-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Symmetric cryptography, hash, and MAC operations for CyberCipher"

[dependencies]
cybercipher-core.workspace = true
cybercipher-codec.workspace = true
serde.workspace = true
serde_json.workspace = true

# RustCrypto block ciphers and modes
cipher = { version = "0.4", features = ["alloc"] }
aes = "0.8"
des = "0.8"
sm4 = "0.5"
ecb = { version = "0.1", features = ["alloc"] }
cbc = { version = "0.1", features = ["alloc"] }
ctr = "0.9"
cfb-mode = "0.8"
ofb = "0.6"
block-padding = "0.3"

# Digests and MAC
digest = "0.10"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
sm3 = "0.4"
hmac = "0.12"

# AEAD constructions (RustCrypto universal-hashes / aead 0.5 family)
aead = { version = "0.5", features = ["alloc"] }
aes-gcm = "0.10"
ccm = "0.5"
chacha20poly1305 = "0.10"
aes-gcm-siv = "0.10"

# Key derivation functions
pbkdf2 = { version = "0.12", features = ["simple"] }
hkdf = "0.12"
scrypt = { version = "0.11", default-features = false }

[dev-dependencies]
cybercipher-engine.workspace = true
