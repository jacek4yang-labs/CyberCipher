[package]
name = "cybercipher-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Symmetric cryptography, hash, and MAC operations for CyberCipher"

[dependencies]
cybercipher-core.workspace = true
cybercipher-codec.workspace = true
serde.workspace = true
serde_json.workspace = true

# RustCrypto block ciphers (cipher 0.5 family). Modes (ECB/CBC/CTR/CFB/OFB)
# are wired natively in `ciphers.rs` over a shared `BlockEngine` trait, so
# adding a cipher is a table row, not a new mode binding.
cipher = { version = "0.5", features = ["alloc"] }
aes = "0.9"
# aes 0.8 is kept for the aead 0.5-generation crates (aes-gcm/ccm) that take
# AES types as generic parameters.
aes08 = { package = "aes", version = "0.8" }
des = "0.9"
sm4 = "0.6"
serpent = "0.6"
twofish = "0.8"
blowfish = "0.10"
camellia = "0.2"
aria = "0.2"
cast5 = "0.12"
cast6 = "0.2"
idea = "0.6"
rc2 = "0.9"
rc5 = "0.1"
rc6 = "0.1"
threefish = "0.6"
magma = "0.10"
kuznyechik = "0.9"

# Digests and MAC
digest = "0.10"
md-5 = "0.10"
# Residual digest families for parity: all maintained RustCrypto crates from
# the digest-0.10 generation. blake2 0.10 / ripemd 0.1 / md4 0.10 / whirlpool
# 0.10 are new direct dependencies (ripemd uses its re-versioned 0.1 line,
# which is the digest-0.10 generation of that crate).
md4 = "0.10"
ripemd = "0.1"
blake2 = "0.10"
whirlpool = "0.10"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
sm3 = "0.4"
hmac = "0.12"
# Residual legacy/national digest families (batch D): all digest-0.10
# generation RustCrypto crates. gost94 is GOST R 34.11-94 (Streebog's
# predecessor) with the standard's test parameter set.
md2 = "0.10"
tiger = "0.2"
streebog = "0.10"
gost94 = "0.10"
shabal = "0.4"
groestl = "0.10"

# Non-cryptographic hashes (checksums.rs). xxhash-rust is already a workspace
# dependency (engine/steg use xxh3); xxh32/xxh64 add no new crates.
xxhash-rust.workspace = true

# AEAD constructions (RustCrypto universal-hashes / aead 0.5 family)
aead = { version = "0.5", features = ["alloc"] }
aes-gcm = "0.10"
ccm = "0.5"
chacha20poly1305 = "0.10"
aes-gcm-siv = "0.10"

# AEAD constructions on the newer aead 0.6 generation (they re-export their
# own `aead`, so no direct 0.6 dependency is needed). eax/ocb3/aes-siv 0.8
# build on cipher 0.5 and the `aes` 0.9 types above.
eax = "0.6"
ocb3 = "0.2"
aes-siv = "0.8"

# MACs outside the HMAC family
cmac = "0.8"
poly1305 = "0.9"

# Stream ciphers
salsa20 = "0.11"
# hc-256/rabbit are on the cipher-0.5 generation; zuc (GB/T 33133 ZUC-128,
# 3GPP EEA3 core) exposes a plain xor-in-place function and rides on the
# cipher-0.4/digest-0.10 crates already in the tree.
hc-256 = "0.6"
rabbit = "0.5"
zuc = "0.4"

# Key derivation functions
pbkdf2 = { version = "0.12", features = ["simple"] }
hkdf = "0.12"
scrypt = { version = "0.11", default-features = false }
argon2 = "0.6"

# Password hashing (bcrypt $2* scheme; rides on the blowfish 0.10 core
# already in the tree, with base64 0.23/getrandom for salt handling)
bcrypt = "0.19"

[dev-dependencies]
cybercipher-engine.workspace = true
criterion.workspace = true

[[bench]]
name = "crypto"
path = "benches/crypto.rs"
harness = false
